<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Usuarios — Educar para Transformar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <style>
        body { background: #f0f4f8; }
        .card { border-radius: 16px; }
        .role-card { cursor: pointer; transition: all .2s; }
        .btn-check:checked + .role-card { background: #0d6efd; color: white; border-color: #0d6efd; }
        #nivelContainer { transition: opacity .2s; }
        .usuario-item { border-left: 4px solid #0d6efd; }
        .badge-alumno  { background: #cfe2ff; color: #084298; }
        .badge-docente { background: #d1e7dd; color: #0a3622; }
        .badge-familia { background: #fff3cd; color: #664d03; }
    </style>
</head>
<body>

<div class="container py-5" style="max-width: 680px;">

    <div class="text-center mb-4">
        <span class="material-symbols-outlined fs-1 text-primary">manage_accounts</span>
        <h3 class="fw-bold text-primary mt-1">Administración de Usuarios</h3>
        <p class="text-muted small">Creá cuentas para alumnos, docentes y tutores</p>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-4 p-md-5">
            <h5 class="fw-bold mb-4">Nuevo usuario</h5>

            <form id="formCrear" novalidate>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-secondary">Nombre</label>
                        <input type="text" id="nombre" class="form-control" placeholder="Ej: Lucas" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-secondary">Apellido</label>
                        <input type="text" id="apellido" class="form-control" placeholder="Ej: Fernández" required>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-secondary">DNI</label>
                        <input type="text" id="dni" class="form-control" placeholder="Sin guiones" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-secondary">Contraseña</label>
                        <input type="password" id="password" class="form-control" placeholder="Mínimo 6 caracteres" minlength="6" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small text-secondary">Rol</label>
                    <div class="row g-2">
                        <div class="col-4">
                            <input type="radio" class="btn-check" name="rol" id="rolAlumno" value="alumno" required>
                            <label class="btn btn-outline-primary w-100 role-card text-center py-2" for="rolAlumno">
                                <span class="material-symbols-outlined d-block mb-1">school</span>
                                <span class="small fw-bold">Alumno</span>
                            </label>
                        </div>
                        <div class="col-4">
                            <input type="radio" class="btn-check" name="rol" id="rolDocente" value="docente">
                            <label class="btn btn-outline-primary w-100 role-card text-center py-2" for="rolDocente">
                                <span class="material-symbols-outlined d-block mb-1">local_library</span>
                                <span class="small fw-bold">Docente</span>
                            </label>
                        </div>
                        <div class="col-4">
                            <input type="radio" class="btn-check" name="rol" id="rolFamilia" value="familia">
                            <label class="btn btn-outline-primary w-100 role-card text-center py-2" for="rolFamilia">
                                <span class="material-symbols-outlined d-block mb-1">family_restroom</span>
                                <span class="small fw-bold">Familia</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div id="nivelContainer" class="mb-4">
                    <label class="form-label fw-bold small text-secondary">Nivel</label>
                    <div class="row g-2">
                        <div class="col-6">
                            <input type="radio" class="btn-check" name="nivel" id="nivelPrimaria" value="primaria">
                            <label class="btn btn-outline-info w-100 text-center py-2 role-card" for="nivelPrimaria">
                                <span class="small fw-bold">Primario</span>
                            </label>
                        </div>
                        <div class="col-6">
                            <input type="radio" class="btn-check" name="nivel" id="nivelSecundaria" value="secundaria">
                            <label class="btn btn-outline-info w-100 text-center py-2 role-card" for="nivelSecundaria">
                                <span class="small fw-bold">Secundario</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div id="msgError" class="alert alert-danger d-none py-2 small"></div>

                <button type="submit" id="btnCrear" class="btn btn-primary w-100 fw-bold py-2">
                    <span class="material-symbols-outlined align-middle me-1" style="font-size:18px">person_add</span>
                    Crear usuario
                </button>
            </form>
        </div>
    </div>

    <div id="listaUsuarios">
        <h6 class="fw-bold text-secondary mb-3">Usuarios creados en esta sesión</h6>
        <div id="itemsUsuarios" class="d-flex flex-column gap-2"></div>
        <p id="sinUsuarios" class="text-muted small text-center mt-2">Todavía no creaste ningún usuario.</p>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
    import { auth, db } from './js/firebase-config.js';
    import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const form         = document.getElementById('formCrear');
    const btnCrear     = document.getElementById('btnCrear');
    const msgError     = document.getElementById('msgError');
    const itemsLista   = document.getElementById('itemsUsuarios');
    const sinUsuarios  = document.getElementById('sinUsuarios');
    const nivelCont    = document.getElementById('nivelContainer');

    // Mostrar/ocultar nivel según el rol
    document.querySelectorAll('input[name="rol"]').forEach(radio => {
        radio.addEventListener('change', () => {
            const necesitaNivel = radio.value !== 'familia';
            nivelCont.style.display = necesitaNivel ? 'block' : 'none';
            if (!necesitaNivel) {
                document.querySelectorAll('input[name="nivel"]').forEach(r => r.checked = false);
            }
        });
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msgError.classList.add('d-none');

        const nombre   = document.getElementById('nombre').value.trim();
        const apellido = document.getElementById('apellido').value.trim();
        const dni      = document.getElementById('dni').value.trim();
        const password = document.getElementById('password').value;
        const rol      = document.querySelector('input[name="rol"]:checked')?.value;
        const nivel    = document.querySelector('input[name="nivel"]:checked')?.value || null;

        // Validaciones
        if (!nombre || !apellido || !dni || !password) {
            return mostrarError('Completá todos los campos obligatorios.');
        }
        if (!/^\d+$/.test(dni)) {
            return mostrarError('El DNI debe contener solo números.');
        }
        if (password.length < 6) {
            return mostrarError('La contraseña debe tener al menos 6 caracteres.');
        }
        if (!rol) {
            return mostrarError('Seleccioná un rol.');
        }
        if (rol !== 'familia' && !nivel) {
            return mostrarError('Seleccioná un nivel (Primario o Secundario).');
        }

        btnCrear.disabled = true;
        btnCrear.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creando...';

        const email = `${dni}@escuela.edu.ar`;

        try {
            const cred = await createUserWithEmailAndPassword(auth, email, password);

            await setDoc(doc(db, 'usuarios', cred.user.uid), {
                dni, nombre, apellido, rol, nivel
            });

            agregarALista({ nombre, apellido, dni, rol, nivel });
            form.reset();
            nivelCont.style.display = 'block';

        } catch (err) {
            const msgs = {
                'auth/email-already-in-use': `Ya existe un usuario con DNI ${dni}.`,
                'auth/weak-password':        'La contraseña debe tener al menos 6 caracteres.',
                'auth/invalid-email':        'El formato del DNI no es válido.',
            };
            mostrarError(msgs[err.code] || `Error: ${err.message}`);
        } finally {
            btnCrear.disabled = false;
            btnCrear.innerHTML = '<span class="material-symbols-outlined align-middle me-1" style="font-size:18px">person_add</span>Crear usuario';
        }
    });

    function mostrarError(msg) {
        msgError.textContent = msg;
        msgError.classList.remove('d-none');
    }

    function agregarALista({ nombre, apellido, dni, rol, nivel }) {
        sinUsuarios.style.display = 'none';

        const nivelTexto = nivel === 'primaria' ? 'Primario' : nivel === 'secundaria' ? 'Secundario' : '';
        const badgeClass = `badge-${rol}`;
        const rolTexto   = rol.charAt(0).toUpperCase() + rol.slice(1);

        const div = document.createElement('div');
        div.className = 'card border-0 shadow-sm usuario-item p-3 d-flex flex-row align-items-center gap-3';
        div.innerHTML = `
            <span class="material-symbols-outlined text-primary fs-3">account_circle</span>
            <div class="flex-grow-1">
                <div class="fw-bold">${nombre} ${apellido}</div>
                <div class="text-muted small">DNI: ${dni} · Email: ${dni}@escuela.edu.ar</div>
            </div>
            <div class="d-flex gap-1 flex-wrap justify-content-end">
                <span class="badge rounded-pill ${badgeClass}">${rolTexto}</span>
                ${nivelTexto ? `<span class="badge rounded-pill bg-light text-secondary border">${nivelTexto}</span>` : ''}
            </div>
        `;
        itemsLista.appendChild(div);
    }
</script>
</body>
</html>
