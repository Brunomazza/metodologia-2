<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Setup Usuarios — Solo usar una vez</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

<div class="card shadow p-5" style="max-width:480px;width:100%">
    <h4 class="fw-bold text-primary mb-1">Crear usuarios de prueba</h4>
    <p class="text-muted small mb-4">Ejecuta esto <strong>una sola vez</strong> para registrar los usuarios en Firebase Auth y Firestore. Borrá esta página después.</p>
    <button id="btnCrear" class="btn btn-primary w-100 fw-bold">Crear usuarios</button>
    <div id="log" class="mt-4 font-monospace small"></div>
</div>

<script type="module">
    import { auth, db } from './js/firebase-config.js';
    import { createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const USUARIOS = [
        { dni: '12345678', password: '123456', nombre: 'Lucas', apellido: 'Fernández', rol: 'alumno',  nivel: 'primaria'   },
        { dni: '87654321', password: '123456', nombre: 'Ana',   apellido: 'López',     rol: 'docente', nivel: 'secundaria' },
        { dni: '11111111', password: '123456', nombre: 'Jose',  apellido: '',          rol: 'familia', nivel: null         },
    ];

    const log = document.getElementById('log');
    const btn = document.getElementById('btnCrear');

    function print(msg, ok = true) {
        const p = document.createElement('p');
        p.className = ok ? 'text-success mb-1' : 'text-danger mb-1';
        p.textContent = msg;
        log.appendChild(p);
    }

    btn.addEventListener('click', async () => {
        btn.disabled = true;
        log.innerHTML = '';

        for (const u of USUARIOS) {
            const email = `${u.dni}@escuela.edu.ar`;
            try {
                let uid;

                try {
                    const cred = await createUserWithEmailAndPassword(auth, email, u.password);
                    uid = cred.user.uid;
                } catch (authErr) {
                    if (authErr.code === 'auth/email-already-in-use') {
                        // Ya existe en Auth — iniciamos sesión para obtener el UID
                        const cred = await signInWithEmailAndPassword(auth, email, u.password);
                        uid = cred.user.uid;
                        print(`⚠ ${u.nombre} ya existía en Auth, actualizando Firestore...`);
                    } else {
                        throw authErr;
                    }
                }

                await setDoc(doc(db, 'usuarios', uid), {
                    dni:      u.dni,
                    nombre:   u.nombre,
                    apellido: u.apellido,
                    rol:      u.rol,
                    nivel:    u.nivel,
                });
                print(`✓ ${u.nombre} (${u.rol}) — perfil guardado en Firestore`);

            } catch (err) {
                print(`✗ Error con ${u.nombre}: ${err.message}`, false);
            }
        }

        print('Listo. Podés cerrar esta página.');
        btn.textContent = 'Completado';
    });
</script>
</body>
</html>
